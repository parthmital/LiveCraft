[package]
name = "livecraft-engine"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
livecraft-model.workspace = true
livecraft-dsp.workspace = true
livecraft-devices.workspace = true
livecraft-formats.workspace = true
livecraft-time.workspace = true
cpal.workspace = true
midir.workspace = true
serde.workspace = true
serde_json.workspace = true
hound.workspace = true
sha2.workspace = true
rubato.workspace = true
crossbeam-channel.workspace = true
anyhow.workspace = true
log.workspace = true
rtrb.workspace = true
basedrop.workspace = true
triple_buffer.workspace = true
assert_no_alloc = { workspace = true, optional = true, default-features = false }
thiserror.workspace = true

# JACK on Linux (M06): the jack crate loads libjack when the JACK host is first used, so the app runs
# without JACK installed. Building needs the JACK headers (libjack-jackd2-dev), which CI installs.
[target.'cfg(target_os = "linux")'.dependencies]
cpal = { workspace = true, features = ["jack"] }

[dev-dependencies]
assert_no_alloc = { workspace = true, default-features = false }

[features]
# The ASIO host on Windows (DECISIONS D31, D-OWN-2). Building it needs the Steinberg ASIO SDK, named by
# the CPAL_ASIO_DIR environment variable, so it is off by default and on in release builds.
asio = ["cpal/asio"]
default = ["rt-checks", "disable-release-checks"]
# Runs audio code inside `assert_no_alloc`, which aborts on allocation.
rt-checks = ["dep:assert_no_alloc"]
# Turns the checks off in release builds. Build with `--no-default-features --features rt-checks` to
# keep them on in release, which the 10-minute playback test needs (M05 item 11).
disable-release-checks = ["assert_no_alloc?/disable_release"]

[lints]
workspace = true
