# cargo-deny configuration. Run with `cargo xtask ci` (or `cargo deny check` with cargo-deny 0.20.2).
# Licence policy: plans/livecraft-1.0/reference/DECISIONS.md D13 and D14.

[graph]
all-features = false

[advisories]
# RustSec advisories. Add an entry only with an `id` and a `reason`, never silently.
ignore = []

[licenses]
confidence-threshold = 0.9
allow = [
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-1-Clause",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "BSL-1.0",
    "CC0-1.0",
    "ISC",
    "MIT",
    "MIT-0",
    "MPL-2.0",
    "OFL-1.1",
    "Unicode-3.0",
    "Unlicense",
    "Zlib",
]

# egui's bundled fonts (Ubuntu-Light under the Ubuntu Font Licence, which permits redistribution).
# Remove when M13 replaces egui's default fonts with the measured open font.
[[licenses.exceptions]]
crate = "epaint_default_fonts"
allow = ["Ubuntu-font-1.0"]

[bans]
multiple-versions = "allow"
wildcards = "deny"
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
