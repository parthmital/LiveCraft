[workspace]
resolver = "2"
members = [
    "crates/livecraft-core",
    "crates/livecraft-dsp",
    "crates/livecraft-gui",
    "crates/livecraft-cli",
    "xtask",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.95"
license = "MIT OR Apache-2.0"
repository = "https://github.com/parthmital/LiveCraft"
publish = false

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
dbg_macro = "deny"
todo = "deny"
unimplemented = "deny"

[workspace.dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
quick-xml = { version = "0.42.0", features = ["serialize"] }
flate2 = "1.0"
anyhow = "1.0"
thiserror = "2.0.21"
log = "0.4"
env_logger = "0.11"
clap = { version = "4.5", features = ["derive"] }
hound = "3.5"
cpal = "0.18.2"
crossbeam-channel = "0.5"
eframe = { version = "0.37.0", default-features = false, features = ["default_fonts", "wgpu", "x11", "wayland"] }
egui = "0.37.0"
insta = { version = "1.49.0", features = ["json"] }
livecraft-testkit = { path = "crates/livecraft-testkit" }
livecraft-model = { path = "crates/livecraft-model" }
